[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -nopw -create -xrandr resize
autostart=true
autorestart=true
stderr_logfile=/tmp/x11vnc.err.log
stdout_logfile=/tmp/x11vnc.out.log

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autostart=true
autorestart=true
stderr_logfile=/tmp/novnc.err.log
stdout_logfile=/tmp/novnc.out.log
